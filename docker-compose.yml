services:
  api:
    build: .
    container_name: market-intelligence-api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    ports:
      - "${API_PORT}:${API_PORT}"
    command: python run.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${API_PORT}/health', timeout=10)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  dashboard:
    build: .
    container_name: market-intelligence-dashboard
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    ports:
      - "${DASHBOARD_PORT}:${DASHBOARD_PORT}"
    depends_on:
      api:
        condition: service_healthy
    command: streamlit run dashboard/main.py --server.address ${DASHBOARD_HOST} --server.port ${DASHBOARD_PORT}
